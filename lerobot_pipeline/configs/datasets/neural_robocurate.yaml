# Rebuild NeuralTraj / RoboCurate (GR1 neural trajectory) under the RLDX-1 convention.
#
# Nothing about this dataset is written here: `dataset:` pulls the source
# description, state layout and upstream identity from dataset_registry, and
# `profile:` pulls the resize, encoding and output version from
# configs/profiles/rldx1.yaml. What is left is where this run reads and writes.
#
#     python -m lerobot_pipeline.plan --config lerobot_pipeline/configs/datasets/neural_robocurate.yaml
#
# NOT REBUILDABLE YET -- `plan` refuses this config and says why:
#   state.left_arm (7 slots at 0-6) is declared with no source column
#   state.left_hand (6 slots at 7-12) is declared with no source column
#   state.left_leg (6 slots at 13-18) is declared with no source column
#   ... and 13 more
#
# The upstream is already a LeRobot dataset, so there is no conversion
# stage: point source.path at it and the layout and video steps run.

name: neural_robocurate

dataset: neural_robocurate
profile: rldx1

source:
  path: /scratch/raw/neural_robocurate

dest:
  path: /scratch/out/neural_robocurate
