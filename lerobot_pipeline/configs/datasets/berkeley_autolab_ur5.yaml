# Rebuild Berkeley AUTOLab UR5 under the RLDX-1 convention.
#
# Nothing about this dataset is written here: `dataset:` pulls the source
# description, state layout and upstream identity from dataset_registry, and
# `profile:` pulls the resize, encoding and output version from
# configs/profiles/rldx1.yaml. What is left is where this run reads and writes.
#
#     python -m lerobot_pipeline.plan --config lerobot_pipeline/configs/datasets/berkeley_autolab_ur5.yaml
#
# source.path must be a directory named after the RLDS dataset --
# openx_rlds.py keys OXE_DATASET_CONFIGS off the directory name.

name: berkeley_autolab_ur5

dataset: berkeley_autolab_ur5
profile: rldx1

source:
  path: /scratch/raw/berkeley_autolab_ur5
  args: {use_videos: true}

dest:
  path: /scratch/out/berkeley_autolab_ur5
