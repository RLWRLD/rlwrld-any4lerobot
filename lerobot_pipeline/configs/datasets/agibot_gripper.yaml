# Rebuild AgiBot World (gripper subset, parts 1-4) under the RLDX-1 convention.
#
# Nothing about this dataset is written here: `dataset:` pulls the source
# description, state layout and upstream identity from dataset_registry, and
# `profile:` pulls the resize, encoding and output version from
# configs/profiles/rldx1.yaml. What is left is where this run reads and writes.
#
#     python -m lerobot_pipeline.plan --config lerobot_pipeline/configs/datasets/agibot_gripper.yaml

name: agibot_gripper

dataset: agibot_gripper
profile: rldx1

source:
  path: /scratch/raw/agibot_gripper
  args: {executor: local}

dest:
  path: /scratch/out/agibot_gripper
