# How the RLDX-1 pre-training collection is built.
#
# One file for the whole convention: how state is laid out, how video is sized and
# encoded, and what version comes out. A dataset spec says what a dataset *is*; a
# run config says where this run reads and writes; this says how the processing is
# done. Reproducing the delivered datasets means running everything under this
# profile.
#
# Switching the collection to a different convention later is a second profile
# alongside this one, not an edit to any dataset spec -- which matters because the
# existing checkpoint's per-embodiment projector was trained on the slot order
# gr1_body_parts declares.

state:
  # <layout a dataset declares>: <layout to actually build it with>
  #
  # Not a list of layouts, and not something a dataset has three of -- every dataset
  # declares exactly one. There are three lines because the collection contains three
  # layout families, and RLDX-1 builds each of them as delivered, so both sides match.
  #
  # Changing a right-hand side re-lays-out every dataset in that family at once. No
  # dataset spec is touched, because none of them contain slot numbers: a spec gives
  # each block's width, the layout gives the order, and the slots follow. That is why
  # one layout serves different widths -- gr1_body_parts is 44 for action_net and 34
  # for agibot_gripper, whose hand blocks are one slot wide instead of six.
  build_layout_as:
    gr1_body_parts: gr1_body_parts
    arms_then_hands: arms_then_hands
    galaxea_r1: galaxea_r1

video:
  # RLDX takes images at their original aspect ratio and resizing during training
  # is disabled, so the dataset itself has to carry the target resolution
  resize:
    type: resize_preserve_aspect_area
    max_area: 65536 # 256 ** 2
    multiple: 32 # image patch size
    # Which resampler does the downscale, in libswscale's own names -- the same
    # vocabulary ffmpeg's `scale` filter takes, because both paths that resize end in
    # libswscale. It belongs here for the reason codec and crf belong in an encoding
    # profile: it decides what the output looks like, so it should be a declared value
    # and not a default nobody chose.
    #
    # It is only visible on a dataset that actually downscales, which is why bicubic
    # went unnoticed for so long: cmu_stretch and austin_buds are 128x128 at the source,
    # already the target size, so the resize composes to nothing.
    #
    # One filter for the whole collection, and it is sinc. Measured as total video
    # bytes against the delivered copies, rebuilt through the real pipeline --
    # verification/records/resize-filter-sweep.md and speed.md:
    #
    #                1.21-1.25x      1.31x        1.94x    2.50x    worst
    #   bicubic           -       0.985/1.019     0.811    0.885    18.9%
    #   lanczos           -       1.021/1.053     0.857    0.913    14.3%
    #   sinc          >1.15 FAIL  1.100/1.088     0.959    0.988    15%+
    #
    # Every filter comes out larger the gentler the downscale, so choosing one slides
    # that curve rather than levelling it. sinc has the flattest curve and is the only
    # filter within 5% at the strong end: dlr_edan went 0.79x to 0.96x and ucsd 0.885x
    # to 0.99x.
    #
    # What one value costs, both measured, both accepted here rather than worked around:
    #
    #   Two datasets fail on video size. stanford_hydra at 1.25x down and taco_play at
    #   1.21x are where sinc's overshoot passes SIZE_TOLERANCE -- 24 and 11 episodes
    #   under the run that used sinc everywhere. A 1.3x threshold took both to zero,
    #   and it was removed along with this decision rather than left behind as dead
    #   configuration. verification/README.md records what it measured.
    #
    #   19% of build throughput against lanczos and 24% against bicubic: 1,273 frames/s
    #   against 1,516 and 1,581. sinc is the widest kernel libswscale has, and on a
    #   dataset that actually downscales the resize is 55% of a worker's time.
    #
    # One value rather than a rule is a statement about what the collection is: every
    # camera resized the same way, whatever its scale factor.
    filter: sinc
  # No encoding, on purpose. The collection was not delivered in one: 19 of the
  # datasets carry LeRobot's own AV1 and 17 carry the H.264 only ffmpeg produces,
  # and which one a dataset is belongs in that dataset's spec, where it is a record
  # of the delivered copy rather than an instruction.
  #
  # Naming one here is how you say "build the whole collection this way instead",
  # and it overrides every spec -- so writing rldx1_reference here, which is what
  # this file used to do, silently asks for the 19 AV1 datasets to be rebuilt as
  # H.264. Reproducing what was delivered is the absence of the key.

dest:
  version: lerobot_v21
  # Where a built dataset is published. The collection's own address, so it sits
  # here rather than in a machine's file -- every machine that builds under this
  # profile publishes to the same place. {profile} and {dataset} are substituted.
  uri: s3://rlwrld-foundry-data/lerobot/{profile}/{dataset}/

builders:
  # Flags the convention wants, whichever machine runs it. A dataset supplies what
  # only it knows (--eef-type), and an environment supplies what only the machine
  # knows (--executor); this is the layer in between.
  openx:
    # emit mp4 rather than a folder of images, which is what every delivered copy is
    use_videos: true
    # Write each camera's channels in the order the RLDS file stores them.
    #
    # Open X-Embodiment's own transforms reverse five datasets' cameras, commented
    # "flip image & wrist_image from bgr to rgb". The delivered copies were written
    # without that flip, so reproducing them means not flipping either: measured on
    # utaustin_mutex against the RLDS source, the delivered frames correlate 0.99
    # with the source read as-is and 0.73 with it reversed.
    #
    # This is therefore a record of how the collection was built, not a claim that
    # its colours are right -- under `as_source` red and blue are exchanged against
    # what those five datasets' cameras saw. `bgr_to_rgb` builds them the other way,
    # and leaves the other 22 datasets identical either way.
    channels: as_source
    # No encoding here: the OXE sources were not all encoded the same way. Most carry
    # LeRobot's own AV1, nine carry the H.264 only ffmpeg produces, and which one a
    # dataset is comes from its own spec. That choice also decides where the resize
    # happens -- written straight at the new size when the converter can produce the
    # encoding, transcoded afterwards when it cannot -- so neither is set here.
