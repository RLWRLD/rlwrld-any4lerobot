# A large single instance with fast local storage.
#
# Sources are staged under /scratch/raw and output goes to /scratch/out. Everything
# else -- how a dataset is read, how its state is laid out, how its video is
# handled -- comes from the dataset spec and the profile, so this file does not
# grow when a dataset is added.

profile: rldx1

raw_root: /scratch/raw
out_root: /scratch/out
# how far each dataset has got; survives a restart, so a run resumes
state_root: /scratch/state

batch:
  # How many datasets a stage processes together. A single small dataset does not
  # keep a large machine busy -- work is parallelised per file, so workers beyond
  # the file count sit idle, and 14 of the 36 datasets have under a thousand
  # episodes. Anything already carrying target_episodes runs on its own.
  max_datasets: 3
  target_episodes: 768

builders:
  # RLDS splits by episode, so one dataset can use the whole instance. Task size and
  # worker count are both worked out on the machine rather than written down; each
  # field below carries the measurement it was set from.
  #
  # The image writer is turned down to one process because the parallelism has moved
  # up a level: every worker used to spawn five of them, which on 24 workers is 144
  # processes each holding TensorFlow. One writer per task, many tasks.
  #
  # -1 is "as many workers as this machine can hold". It used to mean one per core,
  # and cores were the wrong question: the constraint is memory per *worker*, which
  # runs 4.7 GB to 9.3 GB across this collection, so 48 workers on a 48-core 185 GB
  # node asked for 226 GB and the kernel killed twelve of them. worker_budget sizes
  # it from the episode a dataset actually has.
  #
  # A number written down is a number for one machine: 64 was chosen on a 192-core
  # instance and then run on 48-core ones, where it oversubscribed by a third.
  #
  # With max_datasets above 1 the orchestrator also declares how many builds share
  # the node, because each one sizes itself against the memory it can see and what
  # it can see is the whole machine however many are started.
  openx:
    executor: local
    # 8 rather than 25, measured. Finer is better on both axes at once: 25 leaves a
    # large node with fewer tasks than workers, so the tail is one straggler while
    # everything else idles, and a task carries its own reader and buffers so a smaller
    # one carries less. Below about 8 the per-task setup costs more than the parallelism
    # buys. Numbers in verification/records/speed.md.
    episodes_per_task: 8
    workers: -1
    image_writer_process: 0
    image_writer_threads: 4
  # one temporary dataset per 100 episodes, distributed across cores by datatrove
  spec: {executor: local, episodes_per_task: 100}
  agibot: {executor: local, episodes_per_task: 100}

runtime:
  # left to the pipeline, which sizes them from the core count and the file count;
  # set them here to pin a run instead
  #
  # Unset, each build in a batch plans ffmpeg for the whole node, so a batch of three
  # oversubscribes threefold. Left alone deliberately: x264 cannot saturate the
  # threads it is given at this output size, and 16x16 measured marginally faster
  # than 16x1. Memory is the one that wedges a node, and that one is divided.
  workers: null
  threads_per_ffmpeg: null
  # What this machine's link carries, for the CRT client's target_bandwidth. Leaving it
  # unset halves the download and says nothing about why -- measured at 1,330.8 MB/s
  # undeclared against 2,687.7 MB/s declared, on the same node and data. Declare what
  # the instance actually has: m7i.12xlarge is 18.75Gb/s, m8i.16xlarge is 30Gb/s.
  # Numbers in verification/records/speed.md.
  nic_rate: 30Gb/s
