[project]
name = "any4lerobot"
version = "0.1.0"
description = "A tool collection for LeRobot: dataset converters, version conversion and preprocessing"
requires-python = ">=3.12"

# LeRobot itself is pinned to a commit rather than a PyPI release. The converters
# here use lerobot.datasets.dataset_writer and the v3.0 metadata layout, neither of
# which exists in the published 0.4.x wheels.
dependencies = [
    # [dataset] pulls in `datasets`, which lerobot.datasets requires at import time.
    "lerobot[dataset]",
    "datatrove>=0.6.0",
    "torchcodec",
    "numpy",
]

[project.optional-dependencies]
# Converters that read HDF5 sources.
hdf5 = ["h5py"]
actionnet = ["h5py"]
agibot = ["h5py"]
libero = ["h5py"]
robocasa = ["h5py"]
robomind = ["h5py"]
# Distributed execution across cores or nodes (--executor ray).
ray = ["datatrove[ray]>=0.6.0"]
# Fast S3 fetch. awscrt is the same transfer engine behind the AWS CLI's `crt`
# client, measured ~10x the stock one; boto3 is used for listing and as a fallback.
s3 = ["awscrt", "boto3"]

# NOTE on the v3.0 -> v2.1 downgrade: ds_version_convert/v30_to_v21/README.md asks
# for `datasets<4.0.0`, which no longer has a solution -- the pinned lerobot requires
# datasets>=4.8.0. The script itself only imports `datasets.Dataset`, so it is run in
# this same environment; the README predates that lerobot pin.

[tool.uv]
# A collection of scripts, not an importable distribution: nothing to build.
package = false

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "9e14584904d14eb79dc960b27bb40220f85bb993" }
