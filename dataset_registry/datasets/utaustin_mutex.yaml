id: utaustin_mutex
name: "UT Austin MUTEX"

# Not traced to an upstream release, so every block below is `declared` -- read
# back from the delivered copy rather than measured against a source vector.
# The dataset is still rebuildable: openx2lerobot writes observation.state
# itself from OXE_DATASET_CONFIGS, so there is no layout here for a source
# column to satisfy.
upstream:
  commercial_use: null

mirrors:
  - kind: foundry
    uri: s3://rlwrld-foundry-data/external/utaustin_mutex/
    # stops above 0.1.0/ on purpose: `aws s3 sync <prefix>/ <dir>` copies
    # what is under the prefix, and tfds needs that version directory to
    # still be there as <data_dir>/utaustin_mutex/0.1.0/
    layout: rlds
    objects: 258
    bytes: 22326291434

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/openx_lerobot/utaustin_mutex
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 1500
  frames: 361883
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    image: {shape: [128, 128, 3], codec: av1, profile: main, gop: 2, bframes: 0}
    wrist_image: {shape: [128, 128, 3], codec: av1, profile: main, gop: 2, bframes: 0}
  converted_by: alin_lab

source:
  # Rebuilt by openx2lerobot, which reads the RLDS/tfrecord source and writes
  # observation.state itself from OXE_DATASET_CONFIGS[utaustin_mutex]. The block boundaries
  # under lerobot.state are that convention's output, and they were checked against
  # the delivered copy: the two agree.
  #
  # RLDS cannot be described in YAML the way an hdf5 tree can, so this names the
  # converter rather than the files. Point --raw-dir at a directory called
  # utaustin_mutex -- openx_rlds.py keys OXE_DATASET_CONFIGS off the directory name.
  builder: openx

lerobot:
  robot_type: franka
  fps: 20
  embodiment_tag: utaustin_mutex

  video:
    # measured from the RLDS mirror's own features.json, per camera
    cameras:
      image: {shape: [128, 128, 3], modality: primary}
      wrist_image: {shape: [128, 128, 3], modality: wrist}
    # The delivered size is exactly what the rldx1 resize makes of the source size
    # above -- checked for every OXE camera whose delivered shape is recorded, and it
    # holds for all of them. The AV1/GOP2 encoding does not contradict that:
    # openx2lerobot resizes the frames and then calls LeRobot's writer, so the
    # writer's fingerprint survives a resize.
    resize: resize_preserve_aspect_area
    encoding: lerobot_av1_default
    keeps_original: false

  features:
    - absolute_action

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"joint_position": {"start": 0, "end": 7}, "gripper_position": {"start": 7, "end": 8}}
    action: {"end_effector_position": {"start": 0, "end": 3, "absolute": false}, "end_effector_rotation": {"start": 3, "end": 6, "absolute": false}, "gripper_close": {"start": 6, "end": 7, "dtype": "int64", "range": [0, 1]}}

  state:
    width: 8
    layout: oxe_joint_gripper
    source_features: {}
    blocks:
      joint_position: {width: 7, evidence: declared}
      gripper_position: {width: 1, evidence: declared}

  action:
    # 7 wide against a 8-wide state; composition not recovered
    width: 7
    layout: unrecovered
    source_features: {}
    blocks:
      unrecovered: {width: 7, evidence: unknown}

notes: >-
  Read from the delivered copy at openx_lerobot/utaustin_mutex. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
