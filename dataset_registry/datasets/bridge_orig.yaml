id: bridge_orig
name: "BridgeData V2"

# Not yet traced to an upstream release. Recorded from the delivered copy only,
# which is why every block below is `declared` and the dataset is not buildable.
upstream:
  commercial_use: null

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/openx_lerobot/bridge_orig
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 60064
  frames: 2135463
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    image_1: {shape: [256, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    image_2: {shape: [256, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    image_0: {shape: [256, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    image_3: {shape: [256, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
  converted_by: alin_lab

lerobot:
  robot_type: WidowX
  fps: 5
  embodiment_tag: bridge_orig

  video:
    # source-side geometry is unknown: this dataset has not been traced to an
    # upstream release, so only its delivered form is recorded (see delivered.video)
    cameras:
      image_1: {}
      image_2: {}
      image_0: {}
      image_3: {}
    encoding: rldx1_reference
    keeps_original: false

  features:
    - absolute_action

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"end_effector_position": {"start": 0, "end": 3}, "end_effector_rotation": {"start": 3, "end": 6}, "gripper_position": {"start": 7, "end": 8}}
    action: {"end_effector_position": {"start": 0, "end": 3, "absolute": false}, "end_effector_rotation": {"start": 3, "end": 6, "absolute": false}, "gripper_close": {"start": 6, "end": 7, "dtype": "int64", "range": [0, 1]}}

  state:
    width: 8
    layout: oxe_eef_position_eef_rotation_unused_1_gripper
    source_features: {}
    blocks:
      end_effector_position: {width: 3, evidence: declared}
      end_effector_rotation: {width: 3, evidence: declared}
      unused_1: {width: 1, evidence: declared}  # padding in the 8-wide OXE vector
      gripper_position: {width: 1, evidence: declared}

  action:
    # 7 wide against a 8-wide state; composition not recovered
    width: 7
    layout: unrecovered
    source_features: {}
    blocks:
      unrecovered: {width: 7, evidence: unknown}

notes: >-
  Read from the delivered copy at openx_lerobot/bridge_orig. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
