id: bridge_orig
name: "BridgeData V2"

# Not traced to an upstream release, so every block below is `declared` -- read
# back from the delivered copy rather than measured against a source vector.
# The dataset is still rebuildable: openx2lerobot writes observation.state
# itself from OXE_DATASET_CONFIGS, so there is no layout here for a source
# column to satisfy.
upstream:
  commercial_use: null

mirrors:
  - kind: foundry
    uri: s3://rlwrld-foundry-data/external/bridge_orig/
    # stops above 0.0.1/ on purpose: `aws s3 sync <prefix>/ <dir>` copies
    # what is under the prefix, and tfds needs that version directory to
    # still be there as <data_dir>/bridge_orig/0.0.1/
    layout: rlds
    objects: 1154
    bytes: 132474356077

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/openx_lerobot/bridge_orig
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 60064
  frames: 2135463
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    image_1: {shape: [256, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    image_2: {shape: [256, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    image_0: {shape: [256, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    image_3: {shape: [256, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
  converted_by: alin_lab

source:
  # Rebuilt by openx2lerobot, which reads the RLDS/tfrecord source and writes
  # observation.state itself from OXE_DATASET_CONFIGS[bridge_orig]. The block boundaries
  # under lerobot.state are that convention's output, and they were checked against
  # the delivered copy: the two agree.
  #
  # RLDS cannot be described in YAML the way an hdf5 tree can, so this names the
  # converter rather than the files. Point --raw-dir at a directory called
  # bridge_orig -- openx_rlds.py keys OXE_DATASET_CONFIGS off the directory name.
  builder: openx

lerobot:
  robot_type: WidowX
  fps: 5
  embodiment_tag: bridge_orig

  video:
    # measured from the RLDS mirror's own features.json, per camera
    cameras:
      image_1: {shape: [256, 256, 3], modality: secondary}
      image_2: {shape: [256, 256, 3], modality: null}
      image_0: {shape: [256, 256, 3], modality: primary}
      image_3: {shape: [256, 256, 3], modality: null}
    # H.264 High with a 250-frame GOP is the rldx1_reference profile, which
    # only our encoder produces -- so the delivered copy was re-encoded, and
    # reproducing it means running the profile's resize step
    resize: resize_preserve_aspect_area
    encoding: h264_crf21
    keeps_original: false

  features:
    - absolute_action

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"end_effector_position": {"start": 0, "end": 3}, "end_effector_rotation": {"start": 3, "end": 6}, "gripper_position": {"start": 7, "end": 8}}
    action: {"end_effector_position": {"start": 0, "end": 3, "absolute": false}, "end_effector_rotation": {"start": 3, "end": 6, "absolute": false}, "gripper_close": {"start": 6, "end": 7, "dtype": "int64", "range": [0, 1]}}

  state:
    width: 8
    layout: oxe_eef_position_eef_rotation_unused_1_gripper
    source_features: {}
    blocks:
      end_effector_position: {width: 3, evidence: declared}
      end_effector_rotation: {width: 3, evidence: declared}
      unused_1: {width: 1, evidence: declared}  # padding in the 8-wide OXE vector
      gripper_position: {width: 1, evidence: declared}

  action:
    # 7 wide against a 8-wide state; composition not recovered
    width: 7
    layout: unrecovered
    source_features: {}
    blocks:
      unrecovered: {width: 7, evidence: unknown}

notes: >-
  Read from the delivered copy at openx_lerobot/bridge_orig. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
