id: oneuniverse_simul
name: "OneUniverse (simulated, GR1 T2)"

# Not yet traced to an upstream release. Recorded from the delivered copy only,
# which is why every block below is `declared` and the dataset is not buildable.
upstream:
  commercial_use: null

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/oneuniverse_simul/gen_all_lerobot_merged_clean
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 193559
  frames: 33994590
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    ego_view: {shape: [256, 256, 3], codec: av1, profile: main, gop: 2, bframes: 0}
  converted_by: alin_lab

source:
  # No converter for this source yet. Its upstream has not been traced,
  # so there is nothing to point a builder at; `plan` reports it as not
  # rebuildable rather than letting a run start and fail late.
  builder: none

lerobot:
  robot_type: gr1t2
  fps: 20
  embodiment_tag: oneuniverse_simul

  video:
    # source-side geometry is unknown: this dataset has not been traced to an
    # upstream release, so only its delivered form is recorded (see delivered.video)
    cameras:
      ego_view: {}
    # AV1 with a two-frame GOP is LeRobot's own writer default, which
    # survives only if nothing re-encoded the file. So this dataset was
    # never resized, and running a video step over it would produce
    # something the delivered copy is not.
    resize: null
    encoding: lerobot_av1_default
    keeps_original: false

  features:
    - annotation.human.coarse_action

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"left_arm": {"start": 0, "end": 7, "original_key": "observation.state"}, "left_hand": {"start": 7, "end": 13, "original_key": "observation.state"}, "left_leg": {"start": 13, "end": 19, "original_key": "observation.state"}, "neck": {"start": 19, "end": 22, "original_key": "observation.state"}, "right_arm": {"start": 22, "end": 29, "original_key": "observation.state"}, "right_hand": {"start": 29, "end": 35, "original_key": "observation.state"}, "right_leg": {"start": 35, "end": 41, "original_key": "observation.state"}, "waist": {"start": 41, "end": 44, "original_key": "observation.state"}}
    action: {"left_arm": {"start": 0, "end": 7, "original_key": "action"}, "left_hand": {"start": 7, "end": 13, "original_key": "action"}, "left_leg": {"start": 13, "end": 19, "original_key": "action"}, "neck": {"start": 19, "end": 22, "original_key": "action"}, "right_arm": {"start": 22, "end": 29, "original_key": "action"}, "right_hand": {"start": 29, "end": 35, "original_key": "action"}, "right_leg": {"start": 35, "end": 41, "original_key": "action"}, "waist": {"start": 41, "end": 44, "original_key": "action"}}

  state:
    width: 44
    layout: gr1_body_parts
    source_features: {}
    blocks:
      left_arm: {width: 7, evidence: declared}
      left_hand: {width: 6, evidence: declared}
      left_leg: {width: 6, evidence: declared}
      neck: {width: 3, evidence: declared}
      right_arm: {width: 7, evidence: declared}
      right_hand: {width: 6, evidence: declared}
      right_leg: {width: 6, evidence: declared}
      waist: {width: 3, evidence: declared}

notes: >-
  Read from the delivered copy at oneuniverse_simul/gen_all_lerobot_merged_clean. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
