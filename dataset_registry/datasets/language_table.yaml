id: language_table
name: "Language-Table (xArm)"

# Not traced to an upstream release, so every block below is `declared` -- read
# back from the delivered copy rather than measured against a source vector.
# The dataset is still rebuildable: openx2lerobot writes observation.state
# itself from OXE_DATASET_CONFIGS, so there is no layout here for a source
# column to satisfy.
upstream:
  commercial_use: null

mirrors:
  - kind: foundry
    uri: s3://rlwrld-foundry-data/external/language_table/
    # stops above 0.1.0/ on purpose: `aws s3 sync <prefix>/ <dir>` copies
    # what is under the prefix, and tfds needs that version directory to
    # still be there as <data_dir>/language_table/0.1.0/
    layout: rlds
    objects: 1026
    bytes: 429361685247

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/openx_lerobot/language_table
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 442226
  frames: 7045476
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    primary: {shape: [192, 320, 3], codec: h264, profile: high, gop: 250, bframes: 2}
  converted_by: alin_lab

source:
  # Rebuilt by openx2lerobot, which reads the RLDS/tfrecord source and writes
  # observation.state itself from OXE_DATASET_CONFIGS[language_table]. The block boundaries
  # under lerobot.state are that convention's output, and they were checked against
  # the delivered copy: the two agree.
  #
  # RLDS cannot be described in YAML the way an hdf5 tree can, so this names the
  # converter rather than the files. Point --raw-dir at a directory called
  # language_table -- openx_rlds.py keys OXE_DATASET_CONFIGS off the directory name.
  builder: openx

lerobot:
  robot_type: xArm
  fps: 10
  embodiment_tag: language_table

  video:
    # measured from the RLDS mirror's own features.json, per camera
    cameras:
      primary: {}
    # H.264 High with a 250-frame GOP is the rldx1_reference profile, which
    # only our encoder produces -- so the delivered copy was re-encoded, and
    # reproducing it means running the profile's resize step
    resize: resize_preserve_aspect_area
    encoding: rldx1_reference
    keeps_original: false

  features:
    - absolute_action

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"end_effector_position": {"start": 0, "end": 2}}
    action: {"end_effector_position": {"start": 0, "end": 2, "absolute": false}}

  state:
    width: 8
    layout: oxe_eef_position_unused_1
    source_features: {}
    blocks:
      end_effector_position: {width: 2, evidence: declared}
      unused_1: {width: 6, evidence: declared}  # padding in the 8-wide OXE vector

  action:
    # 7 wide against a 8-wide state; composition not recovered
    width: 7
    layout: unrecovered
    source_features: {}
    blocks:
      unrecovered: {width: 7, evidence: unknown}

notes: >-
  Read from the delivered copy at openx_lerobot/language_table. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
