id: action_net
name: Fourier ActionNet

# The upstream release is the dataset's identity: a HuggingFace repo plus the
# revision that pins its exact bytes. Mirrors are copies of that, and foundry
# derives its prefix from the revision -- so the mapping below can be re-checked
# online without touching any mirror.
upstream:
  huggingface: FourierIntelligence/ActionNet
  revision: eb3b5bb16f3a5a7052c1498c1072e78ac99042d0
  homepage: https://action-net.org/
  license: cc-by-nc-sa-4.0
  # one of the three non-commercial sources excluded from Commercial RLDX
  commercial_use: false

mirrors:
  - kind: foundry
    uri: s3://rlwrld-foundry-data/external/action_net/eb3b5bb16f3a5a7052c1498c1072e78ac99042d0/
    layout: tar_archives
    objects: 322
    bytes: 2737000000000

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/action_net
  origin: /storage1/sjw_dataset/dataset/ActionNet
  codebase_version: v2.1
  episodes: 30120
  frames: 15489245
  # what the delivered copy actually is, per camera -- the target a rebuild is
  # checked against. 288x192 is what the resize step produces from 1280x800.
  video:
    primary: {shape: [192, 288, 3], codec: h264, profile: high, gop: 250, bframes: 2}
  # ALIN Lab, ad-hoc, code not kept (Notion 3ac6cbdf-f6f6-80ef-aa98-d85739443184, Q2)
  converted_by: alin_lab

# How the raw files are arranged once the tar shards are unpacked, and how to line
# the robot clock up with the camera clock. Templates take {id} (the episode id)
# and {camera} (the source-side directory named under lerobot.video.cameras).
#
# The robot side is sampled at ~60 Hz and the camera at ~30 Hz on separate clocks,
# which is why a clock strategy is needed at all.
source:
  format: hdf5_episodes
  discover: "*.hdf5"
  paths:
    episode: "{id}.hdf5"
    video: "{id}/{camera}/rgb.mp4"
  tasks:
    file: metadata.json
    key: id
    prompt: prompt
  clock:
    strategy: nearest_timestamp_dedup
    data: timestamp
    image: "{id}/{camera}/timestamps.json"
    image_format: "%Y-%m-%dT%H-%M-%S_%f"
  # where each feature lives inside the hdf5. The emitted LeRobot column names are
  # the separate matter of lerobot.state.source_features below.
  features:
    robot_joints: {state: state/robot, action: action/robot}
    hand_joints: {state: state/hand, action: action/hand}
  # the GR1 T1's own joint count, and six values per hand. A GR2 reports 29 joints
  # and the 12-DoF hand reports 24 values; both mean different things column by
  # column, so an episode with those widths is skipped rather than reinterpreted.
  feature_widths:
    robot_joints: 32
    hand_joints: 12

lerobot:
  robot_type: ActionNet
  fps: 30
  embodiment_tag: action_net

  video:
    cameras:
      # lerobot key -> where it lives in the source, and its size before any resize
      primary: {source: top, shape: [800, 1280, 3]}
    resize: resize_preserve_aspect_area
    encoding: rldx1_reference
    keeps_original: false

  features:
    # emitted alongside state/action, unpermuted, as the delivered dataset does
    - observation.robot_joints
    - observation.hand_joints
    - action.robot_joints
    - action.hand_joints
    - absolute_action

  state:
    width: 44
    layout: gr1_body_parts
    # the LeRobot columns the assembled vector copies from -- the names the
    # delivered dataset carries alongside state/action, not the hdf5 paths
    source_features:
      robot_joints:
        state: observation.robot_joints
        action: action.robot_joints
      hand_joints:
        state: observation.hand_joints
        action: action.hand_joints

    # Widths and sources only -- the order comes from layouts/gr1_body_parts.yaml
    # and the slot numbers are derived from the two. A mapping rather than a list
    # so that this file cannot imply an order of its own.
    blocks:
      left_arm:
        width: 7
        source: {feature: robot_joints, columns: [18, 25]}
        evidence: measured
        note: shoulder pitch/roll/yaw, elbow, wrist yaw/roll/pitch

      left_hand:
        width: 6
        source: {feature: hand_joints, columns: [0, 6]}
        evidence: measured

      left_leg:
        width: 6
        source: {feature: robot_joints, columns: [0, 6]}
        evidence: constant
        note: >-
          hip roll/yaw/pitch and knee are identically zero, ankles hold a fixed
          ~1e-6; the six columns are indistinguishable from each other in the data,
          so the order within the block follows the block structure, not a match

      neck:
        width: 3
        source: {feature: robot_joints, columns: [15, 18]}
        evidence: measured
        note: yaw, roll, pitch

      right_arm:
        width: 7
        source: {feature: robot_joints, columns: [25, 32]}
        evidence: measured

      right_hand:
        width: 6
        source: {feature: hand_joints, columns: [6, 12]}
        evidence: measured

      right_leg:
        width: 6
        source: {feature: robot_joints, columns: [6, 12]}
        evidence: constant

      waist:
        width: 3
        source: {feature: robot_joints, columns: [12, 15]}
        evidence: measured
        note: yaw, pitch, roll

notes: >-
  Recovered by comparing observation.state column-by-column against
  observation.robot_joints / observation.hand_joints across four delivered
  episodes, and independently confirmed by neural_gr1's meta/modality.json, which
  names the same eight blocks at the same offsets. The delivered modality.json
  exposes state as one flat 0..44 block, because RLDX-1 asks ActionNet for
  modality_keys=["state"].
