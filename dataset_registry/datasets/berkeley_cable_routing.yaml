id: berkeley_cable_routing
name: "Berkeley Cable Routing"

# Not yet traced to an upstream release. Recorded from the delivered copy only,
# which is why every block below is `declared` and the dataset is not buildable.
upstream:
  commercial_use: null

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/openx_lerobot/berkeley_cable_routing
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 1482
  frames: 38240
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    top_image: {shape: [128, 128, 3], codec: av1, profile: main, gop: 2, bframes: 0}
    image: {shape: [128, 128, 3], codec: av1, profile: main, gop: 2, bframes: 0}
    wrist45_image: {shape: [128, 128, 3], codec: av1, profile: main, gop: 2, bframes: 0}
    wrist225_image: {shape: [128, 128, 3], codec: av1, profile: main, gop: 2, bframes: 0}
  converted_by: alin_lab

source:
  # Rebuilt by openx2lerobot, which reads the RLDS/tfrecord source and writes
  # observation.state itself from OXE_DATASET_CONFIGS[berkeley_cable_routing]. The block boundaries
  # under lerobot.state are that convention's output, and they were checked against
  # the delivered copy: the two agree.
  #
  # RLDS cannot be described in YAML the way an hdf5 tree can, so this names the
  # converter rather than the files. Point --raw-dir at a directory called
  # berkeley_cable_routing -- openx_rlds.py keys OXE_DATASET_CONFIGS off the directory name.
  builder: openx

lerobot:
  robot_type: franka
  fps: 10
  embodiment_tag: berkeley_cable_routing

  video:
    # source-side geometry is unknown: this dataset has not been traced to an
    # upstream release, so only its delivered form is recorded (see delivered.video)
    cameras:
      top_image: {}
      image: {}
      wrist45_image: {}
      wrist225_image: {}
    encoding: lerobot_av1_default
    keeps_original: false

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"joint_position": {"start": 0, "end": 6}}
    action: {"end_effector_position": {"start": 0, "end": 3, "absolute": false}, "end_effector_rotation": {"start": 3, "end": 6, "absolute": false}, "gripper_close": {"start": 6, "end": 7, "dtype": "int64", "range": [0, 1]}}

  state:
    width: 8
    layout: oxe_joint_unused_1
    source_features: {}
    blocks:
      joint_position: {width: 6, evidence: declared}
      unused_1: {width: 2, evidence: declared}  # padding in the 8-wide OXE vector

  action:
    # 7 wide against a 8-wide state; composition not recovered
    width: 7
    layout: unrecovered
    source_features: {}
    blocks:
      unrecovered: {width: 7, evidence: unknown}

notes: >-
  Read from the delivered copy at openx_lerobot/berkeley_cable_routing. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
