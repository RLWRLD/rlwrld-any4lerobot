id: austin_sirius_dataset_converted_externally_to_rlds
name: "Austin Sirius Dataset (RLDS)"

# Not traced to an upstream release, so every block below is `declared` -- read
# back from the delivered copy rather than measured against a source vector.
# The dataset is still rebuildable: openx2lerobot writes observation.state
# itself from OXE_DATASET_CONFIGS, so there is no layout here for a source
# column to satisfy.
upstream:
  commercial_use: null

mirrors:
  - kind: foundry
    uri: s3://rlwrld-foundry-data/external/austin_sirius_dataset_converted_externally_to_rlds/
    # stops above 0.1.0/ on purpose: `aws s3 sync <prefix>/ <dir>` copies
    # what is under the prefix, and tfds needs that version directory to
    # still be there as <data_dir>/austin_sirius_dataset_converted_externally_to_rlds/0.1.0/
    layout: rlds
    objects: 66
    bytes: 7031694109

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/openx_lerobot/austin_sirius_dataset_converted_externally_to_rlds
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 559
  frames: 279939
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    wrist_image: {shape: [64, 64, 3], codec: av1, profile: main, gop: 2, bframes: 0}
    image: {shape: [64, 64, 3], codec: av1, profile: main, gop: 2, bframes: 0}
  converted_by: alin_lab

source:
  # Rebuilt by openx2lerobot, which reads the RLDS/tfrecord source and writes
  # observation.state itself from OXE_DATASET_CONFIGS[austin_sirius_dataset_converted_externally_to_rlds]. The block boundaries
  # under lerobot.state are that convention's output, and they were checked against
  # the delivered copy: the two agree.
  #
  # RLDS cannot be described in YAML the way an hdf5 tree can, so this names the
  # converter rather than the files. Point --raw-dir at a directory called
  # austin_sirius_dataset_converted_externally_to_rlds -- openx_rlds.py keys OXE_DATASET_CONFIGS off the directory name.
  builder: openx

lerobot:
  robot_type: franka
  fps: 20
  embodiment_tag: austin_sirius_dataset_converted_externally_to_rlds

  video:
    # source-side geometry is unknown: this dataset has not been traced to an
    # upstream release, so only its delivered form is recorded (see delivered.video)
    cameras:
      wrist_image: {}
      image: {}
    # AV1 with a two-frame GOP is LeRobot's own writer default, which
    # survives only if nothing re-encoded the file. So this dataset was
    # never resized, and running a video step over it would produce
    # something the delivered copy is not.
    resize: null
    encoding: lerobot_av1_default
    keeps_original: false

  features:
    - absolute_action

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"end_effector_position": {"start": 0, "end": 3}, "end_effector_rotation": {"start": 3, "end": 7, "rotation_type": "quaternion"}, "gripper_position": {"start": 7, "end": 8}}
    action: {"end_effector_position": {"start": 0, "end": 3, "absolute": false}, "end_effector_rotation": {"start": 3, "end": 6, "absolute": false}, "gripper_close": {"start": 6, "end": 7, "dtype": "int64", "range": [0, 1]}}

  state:
    width: 8
    layout: oxe_eef_position_eef_rotation_gripper
    source_features: {}
    blocks:
      end_effector_position: {width: 3, evidence: declared}
      end_effector_rotation: {width: 4, evidence: declared}
      gripper_position: {width: 1, evidence: declared}

  action:
    # 7 wide against a 8-wide state; composition not recovered
    width: 7
    layout: unrecovered
    source_features: {}
    blocks:
      unrecovered: {width: 7, evidence: unknown}

notes: >-
  Read from the delivered copy at openx_lerobot/austin_sirius_dataset_converted_externally_to_rlds. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
