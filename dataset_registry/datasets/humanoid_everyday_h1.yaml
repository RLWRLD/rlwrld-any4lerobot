id: humanoid_everyday_h1
name: "Humanoid-Everyday (Unitree H1)"

# The upstream is the snapshot under mirrors, which holds this robot and g1
# together; the blocks below are still `declared`, read from the delivered copy.
upstream:
  commercial_use: null

mirrors:
  # One snapshot holds both robots, despite the g1 in the prefix. Its meta/info.json
  # counts 8949 episodes and 3436171 frames, which is exactly g1's 4064 + h1's 4885
  # and 1779287 + 1656884; meta/episodes.jsonl carries a robot_type on every episode.
  # h1 therefore has no mirror of its own to point at -- it is in here.
  #
  # `hf_repo`, not `rlds`: this upstream is already a LeRobot v2.1 tree, with data/,
  # meta/ and videos/ and one camera at 480x640. Rebuilding it is a resize and a
  # re-encode rather than a conversion.
  - kind: foundry
    uri: s3://rlwrld-foundry-data/external/humanoid_everyday_g1/71f6210e91c2a7e8b8e4d47db0147444a1a0640e/
    layout: hf_repo
    # measured 2026-08-19 over the snapshot prefix
    objects: 26868
    bytes: 935068718801

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/humanoid_everyday/humanoid_everyday_h1
  origin: /storage1/sjw_dataset/dataset
  codebase_version: 2.1
  episodes: 4885
  frames: 1656884
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    egocentric: {shape: [480, 640, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    egocentric_resized: {shape: [192, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
  converted_by: alin_lab

source:
  # `none` because the upstream needs no converter, not because it is unknown: it is
  # already LeRobot v2.1, so the pipeline reads it as a lerobot_v21 source and the
  # work is the resize and the re-encode.
  #
  # Splitting the one upstream into g1 and h1 is not part of that work. It changes
  # which episodes a dataset contains, which is decided before a build rather than
  # inside one -- the two trees are staged separately, each from the robot_type its
  # own episodes carry, and each build then sees only its own.
  builder: none

lerobot:
  robot_type: h1
  fps: 30
  embodiment_tag: humanoid_everyday_h1

  video:
    # source-side geometry is unknown: this dataset has not been traced to an
    # upstream release, so only its delivered form is recorded (see delivered.video)
    cameras:
      egocentric: {modality: null}
      egocentric_resized: {}
    # H.264 High with a 250-frame GOP is the rldx1_reference profile, which
    # only our encoder produces -- so the delivered copy was re-encoded, and
    # reproducing it means running the profile's resize step
    resize: resize_preserve_aspect_area
    encoding: h264_crf18_fast
    # one camera is over the area bound: the untouched original is kept
    # beside the resized copy
    keeps_original: true

  features:
    - observation.imu.quaternion
    - observation.imu.accelerometer
    - observation.imu.gyroscope
    - observation.imu.rpy
    - observation.odometry.position
    - observation.odometry.velocity
    - observation.odometry.rpy
    - observation.odometry.quat
    - observation.arm_joints
    - observation.leg_joints
    - observation.hand_joints
    - observation.tactile.sensor_id
    - observation.tactile.values

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"left_arm": {"start": 0, "end": 7}, "left_hand": {"start": 14, "end": 20}, "right_arm": {"start": 7, "end": 14}, "right_hand": {"start": 20, "end": 26}}
    action: {"left_arm": {"start": 0, "end": 7}, "left_hand": {"start": 14, "end": 20}, "right_arm": {"start": 7, "end": 14}, "right_hand": {"start": 20, "end": 26}}

  state:
    width: 26
    layout: arms_then_hands
    # same arrangement as humanoid_everyday_g1 with 6-wide hand blocks: the H1's
    # hand reports 12 values against the G1's 14
    source_features:
      arm:
        state: observation.arm_joints
        action: action.arm_joints
      hand:
        state: observation.hand_joints
        action: action.hand_joints

    blocks:
      left_arm:
        width: 7
        source: {feature: arm, columns: [0, 7]}
        evidence: declared
      right_arm:
        width: 7
        source: {feature: arm, columns: [7, 14]}
        evidence: declared
      left_hand:
        width: 6
        source: {feature: hand, columns: [0, 6]}
        evidence: declared
      right_hand:
        width: 6
        source: {feature: hand, columns: [6, 12]}
        evidence: declared

notes: >-
  Read from the delivered copy at humanoid_everyday/humanoid_everyday_h1. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
