    - observation.gripper_state_left
    - observation.joint_position_arm_right
    - observation.gripper_state_right
    - observation.joint_position_torso
    - original_action
    - absolute_action

  state:
    # no body-part skeleton: left side, right side, then torso. Note action is 26
    # wide while state is 18 -- the two are not the same vector here.
    width: 18
    layout: galaxea_r1
    source_features:
      arm_left:
        state: observation.joint_position_arm_left
        action: action.joint_position_arm_left
      gripper_left:
        state: observation.gripper_state_left
        action: action.gripper_state_left
      arm_right:
        state: observation.joint_position_arm_right
        action: action.joint_position_arm_right
      gripper_right:
        state: observation.gripper_state_right
        action: action.gripper_state_right
      torso:
        state: observation.joint_position_torso
        action: action.joint_position_torso

    blocks:
      arm_left:
        width: 6
        source: {feature: arm_left, columns: [0, 6]}
        evidence: measured

      gripper_left:
        width: 1
        source: {feature: gripper_left, columns: [0, 1]}
        evidence: measured

      arm_right:
        width: 6
        source: {feature: arm_right, columns: [0, 6]}
        evidence: measured

      gripper_right:
        width: 1
        source: {feature: gripper_right, columns: [0, 1]}
        evidence: measured

      torso:
        width: 4
        source: {feature: torso, columns: [0, 4]}
        evidence: measured

  action:
    # Galaxea is the one dataset whose action is not the same vector as its state:
    # 26 wide against 18. It carries no action.* sub-features either, so there is
    # nothing to match against and the composition is genuinely unknown.
    width: 26
    layout: unrecovered
    source_features: {}
    blocks:
      unrecovered:
        width: 26
        evidence: unknown
        note: >-
          composition not recovered; the delivered dataset exposes only
          original_action and absolute_action, both 26 wide, with no sub-vectors

notes: >-
  All 18 state slots matched directly, identically across all five parts. The parts
  come pre-split from the HuggingFace download, not from our own sharding (per ALIN
  Lab, Notion Q13). The action-side source paths named under source_features are
  stated by symmetry with the state side and have NOT been measured -- the delivered
  dataset carries no action.* sub-features.
