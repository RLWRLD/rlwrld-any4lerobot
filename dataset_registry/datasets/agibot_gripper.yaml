id: agibot_gripper
name: AgiBot World (gripper subset, parts 1-4)

upstream:
  huggingface: agibot-world/AgiBotWorld-Beta
  revision: 2252b3fdc88dc67fa5d5e4b771e1b86f5e71c278
  license: cc-by-nc-sa-4.0
  commercial_use: false

delivered:
  # split into agibot_gripper0_part1..part4, identical schema in each
  path: /data/taeyoung/data/vla_pretrain_dataset/agibot/agibot_gripper0_part1
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 59137
  frames: 16028434
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    primary: {shape: [192, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    wrist_left: {shape: [192, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    wrist_right: {shape: [192, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
  converted_by: alin_lab

source:
  # agibot2lerobot reads the raw AgiBot hdf5 tree and
  # writes observation.state itself.
  builder: agibot
  # both subsets are read out of one AgiBotWorld-Beta tree; only
  # --eef-type separates them
  raw_dir: AgiBotWorld-Beta
  # agibot2lerobot converts one end-effector type per run and selects the task ids
  # for it; without this the two subsets would come out identical
  args:
    eef_type: gripper

lerobot:
  robot_type: Agibot
  fps: 30
  embodiment_tag: agibot_gripper

  video:
    cameras:
      primary: {source: head}
      wrist_left: {source: hand_left}
      wrist_right: {source: hand_right}
    resize: resize_preserve_aspect_area
    encoding: h264_crf21
    keeps_original: false

  features:
    - observation.joint_position
    - observation.effector_gripper_pos_mm
    - observation.head_position
    - observation.waist_position
    - action.joint_position
    - action.effector_gripper_pos
    - action.head_position
    - action.waist_position
    - absolute_action

  state:
    # same skeleton as agibot_dexhand with the hand blocks narrowed from 6 to 1:
    # 7|1|6|3|7|1|6|3 = 34
    width: 34
    layout: gr1_body_parts
    source_features:
      joint:
        state: observation.joint_position
        action: action.joint_position
      gripper:
        state: observation.effector_gripper_pos_mm
        action: action.effector_gripper_pos
      head:
        state: observation.head_position
        action: action.head_position
      waist:
        state: observation.waist_position
        action: action.waist_position

    blocks:
      left_arm:
        width: 7
        source: {feature: joint, columns: [0, 7]}
        evidence: measured

      left_hand:
        width: 1
        source: {feature: gripper, columns: [0, 1]}
        evidence: measured
        note: a gripper is one value, so the hand block is 1 wide instead of 6

      left_leg:
        width: 6
        evidence: constant

      neck:
        width: 3
        pad: 1
        source: {feature: head, columns: [0, 2]}
        evidence: measured

      right_arm:
        width: 7
        source: {feature: joint, columns: [7, 14]}
        evidence: measured

      right_hand:
        width: 1
        source: {feature: gripper, columns: [1, 2]}
        evidence: measured

      right_leg:
        width: 6
        evidence: constant

      waist:
        width: 3
        pad: 1
        source: {feature: waist, columns: [0, 2]}
        evidence: measured

notes: >-
  20 of 34 slots matched directly, identically across all four parts. The parts are
  a random 20% sample of the full gripper set, split four ways for parallel
  processing (per ALIN Lab, Notion Q13) -- so they are logically one dataset.
