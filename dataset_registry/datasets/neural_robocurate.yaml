id: neural_robocurate
name: NeuralTraj / RoboCurate (GR1 neural trajectory)

upstream:
  # derived data, not a public dataset: generated by ALIN Lab from GR1 recordings.
  # Reproducing it is an open question (Notion Q13: "재현이 안될 것 같음").
  commercial_use: null

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/neural_traj/neural_robocurate_v1
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 85174
  frames: 7921182
  converted_by: alin_lab

lerobot:
  robot_type: GR1
  fps: 30
  embodiment_tag: neural_gr1

  video:
    cameras:
      ego_view: ego_view
    resize: resize_preserve_aspect_area
    encoding: rldx1_reference
    keeps_original: false

  state:
    # Declared, not recovered: these datasets carry no sub-feature vectors to match
    # against, but their meta/modality.json names all eight blocks outright. It is
    # this file that confirms the action_net / agibot skeleton is a real convention
    # rather than a coincidence.
    width: 44
    layout: gr1_body_parts
    source_features: {}

    blocks:
      - {name: left_arm,   slots: [0, 7],   evidence: declared}
      - {name: left_hand,  slots: [7, 13],  evidence: declared}
      - {name: left_leg,   slots: [13, 19], evidence: declared}
      - {name: neck,       slots: [19, 22], evidence: declared}
      - {name: right_arm,  slots: [22, 29], evidence: declared}
      - {name: right_hand, slots: [29, 35], evidence: declared}
      - {name: right_leg,  slots: [35, 41], evidence: declared}
      - {name: waist,      slots: [41, 44], evidence: declared}

notes: >-
  Covers neural_robocurate_v1..v3 and march_robocurate_v1..v4, which share this
  layout and the neural_gr1 embodiment tag. Marked `declared`, not `measured`: the
  boundaries are exact because the delivered modality.json states them, but there
  are no sub-feature vectors to check them against. Note march_robocurate has no
  codebase_version field in its info.json at all.
