id: iamlab_cmu_pickup_insert_converted_externally_to_rlds
name: "Iamlab Cmu Pickup Insert (RLDS)"

# Not traced to an upstream release, so every block below is `declared` -- read
# back from the delivered copy rather than measured against a source vector.
# The dataset is still rebuildable: openx2lerobot writes observation.state
# itself from OXE_DATASET_CONFIGS, so there is no layout here for a source
# column to satisfy.
upstream:
  commercial_use: null

mirrors:
  - kind: foundry
    uri: s3://rlwrld-foundry-data/external/iamlab_cmu_pickup_insert_converted_externally_to_rlds/
    # stops above 0.1.0/ on purpose: `aws s3 sync <prefix>/ <dir>` copies
    # what is under the prefix, and tfds needs that version directory to
    # still be there as <data_dir>/iamlab_cmu_pickup_insert_converted_externally_to_rlds/0.1.0/
    layout: rlds
    objects: 371
    bytes: 54003201090

delivered:
  path: /data/taeyoung/data/vla_pretrain_dataset/openx_lerobot/iamlab_cmu_pickup_insert_converted_externally_to_rlds
  origin: /storage1/sjw_dataset/dataset
  codebase_version: v2.1
  episodes: 631
  frames: 146241
  # what the delivered copy actually is, per camera -- the target a
  # rebuild is checked against
  video:
    wrist: {shape: [192, 256, 3], codec: h264, profile: high, gop: 250, bframes: 2}
    primary: {shape: [192, 320, 3], codec: h264, profile: high, gop: 250, bframes: 2}
  converted_by: alin_lab

source:
  # Rebuilt by openx2lerobot, which reads the RLDS/tfrecord source and writes
  # observation.state itself from OXE_DATASET_CONFIGS[iamlab_cmu_pickup_insert_converted_externally_to_rlds]. The block boundaries
  # under lerobot.state are that convention's output, and they were checked against
  # the delivered copy: DISAGREES -- the config says JOINT but the delivered copy is laid out as POS_QUAT (3 + 4 + 1). Trust the delivered copy, or re-derive the config entry, before rebuilding this one.
  #
  # RLDS cannot be described in YAML the way an hdf5 tree can, so this names the
  # converter rather than the files. Point --raw-dir at a directory called
  # iamlab_cmu_pickup_insert_converted_externally_to_rlds -- openx_rlds.py keys OXE_DATASET_CONFIGS off the directory name.
  builder: openx

lerobot:
  robot_type: Franka
  fps: 20
  embodiment_tag: iamlab_cmu_pickup_insert_converted_externally_to_rlds

  video:
    # measured from the RLDS mirror's own features.json, per camera
    cameras:
      wrist: {}
      primary: {}
    # H.264 High with a 250-frame GOP is the rldx1_reference profile, which
    # only our encoder produces -- so the delivered copy was re-encoded, and
    # reproducing it means running the profile's resize step
    resize: resize_preserve_aspect_area
    encoding: h264_crf21
    keeps_original: false

  features:
    - absolute_action

  # how the training stack slices the flat vectors, from the delivered
  # meta/modality.json
  modality:
    state: {"end_effector_position": {"start": 0, "end": 3}, "end_effector_rotation": {"start": 3, "end": 7}, "gripper_position": {"start": 7, "end": 8}}
    action: {"end_effector_position": {"start": 0, "end": 3, "absolute": false}, "end_effector_rotation": {"start": 3, "end": 6, "absolute": false}, "gripper_close": {"start": 6, "end": 7, "dtype": "int64", "range": [0, 1]}}

  state:
    width: 8
    layout: oxe_eef_position_eef_rotation_gripper
    source_features: {}
    blocks:
      end_effector_position: {width: 3, evidence: declared}
      end_effector_rotation: {width: 4, evidence: declared}
      gripper_position: {width: 1, evidence: declared}

  action:
    # 7 wide against a 8-wide state; composition not recovered
    width: 7
    layout: unrecovered
    source_features: {}
    blocks:
      unrecovered: {width: 7, evidence: unknown}

notes: >-
  Read from the delivered copy at openx_lerobot/iamlab_cmu_pickup_insert_converted_externally_to_rlds. Block boundaries are declared by its
  own meta/modality.json; no sub-feature vectors are carried, so nothing was
  measured and the columns cannot be traced without the upstream source.
